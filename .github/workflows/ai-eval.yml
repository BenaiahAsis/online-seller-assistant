name: AI evaluation

# Prompt and agent changes are code changes: run the evaluation set against
# the PR's own code. Also runs daily as a live smoke test of the AI provider.
on:
  pull_request:
    paths:
      - "backend/app/agents/**"
      - "backend/evals/**"
  schedule:
    - cron: "0 1 * * *" # 09:00 Philippine time
  workflow_dispatch:

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: ai-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Separate, spend-limited key for CI (repository secrets, never in code).
      OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.EVAL_OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.EVAL_OPENAI_MODEL }}
      DATABASE_URL: sqlite:///./eval.db
      RATE_LIMIT_GENERATE_LISTING: 100/minute
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no evaluation key is configured
        id: guard
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "EVAL_OPENAI_API_KEY secret not set; skipping live evaluation." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Start this commit's backend
        if: steps.guard.outputs.run == 'true'
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done

      - name: Run evaluation set
        if: steps.guard.outputs.run == 'true'
        run: python -m evals.run_eval --base-url http://localhost:8000 --pause 4

      - name: Publish results
        if: always() && steps.guard.outputs.run == 'true'
        run: cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY"
